apiVersion: apps/v1
kind: Deployment
metadata: {name: rag-api, namespace: research-rag}
spec:
  replicas: 2
  selector: {matchLabels: {app: rag-api}}
  template:
    metadata: {labels: {app: rag-api}}
    spec:
      containers:
      - name: api
        image: registry.example.asu.edu/research/rag-api:0.1.0
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: rag-config}
        - secretRef: {name: rag-secrets}
        readinessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 20, periodSeconds: 10}
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {cpu: "2", memory: 4Gi}
        volumeMounts: [{name: objects, mountPath: /data/objects}]
      volumes:
      - name: objects
        persistentVolumeClaim: {claimName: rag-objects}
---
apiVersion: v1
kind: Service
metadata: {name: rag-api, namespace: research-rag}
spec:
  selector: {app: rag-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: rag-worker, namespace: research-rag}
spec:
  replicas: 1
  selector: {matchLabels: {app: rag-worker}}
  template:
    metadata: {labels: {app: rag-worker}}
    spec:
      containers:
      - name: worker
        image: registry.example.asu.edu/research/rag-worker:0.1.0
        command: ["celery","-A","app.worker:celery","worker","--loglevel=INFO"]
        envFrom:
        - configMapRef: {name: rag-config}
        - secretRef: {name: rag-secrets}
        resources:
          requests: {cpu: 500m, memory: 2Gi}
          limits: {cpu: "2", memory: 6Gi}
        volumeMounts: [{name: objects, mountPath: /data/objects}]
      volumes:
      - name: objects
        persistentVolumeClaim: {claimName: rag-objects}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: rag-objects, namespace: research-rag}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 100Gi}}
