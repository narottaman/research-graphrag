apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: research-rag
spec:
  ingressClassName: nginx
  tls:
  - hosts: [rag.example.asu.edu]
    secretName: rag-tls
  rules:
  - host: rag.example.asu.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-api
            port: {number: 80}
