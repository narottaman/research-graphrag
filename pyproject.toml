[project]
name = "research-graphrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "neo4j>=5.23,<7", "chromadb>=0.5,<2", "qdrant-client>=1.11,<2", "httpx>=0.27,<1", "pymupdf>=1.24,<2", "python-multipart>=0.0.9", "google-genai>=1.0,<2", "sentence-transformers>=3,<6", "numpy>=1.26,<3", "tenacity>=8,<10"]
[project.optional-dependencies]
worker = ["celery[redis]>=5.4,<6"]
community = ["networkx>=3.2,<4", "igraph>=0.11,<1", "leidenalg>=0.10,<1"]
visual = ["torch>=2.3", "transformers>=4.45", "Pillow>=10"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
